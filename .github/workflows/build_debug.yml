name: Build Debug APK

on:
  push:
    branches:
      - beta
  workflow_dispatch:

env:
  APK_NAME: build/Iconify-fork-debug.apk

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get application version name
        run: echo "VERSION_NAME=$(${{ github.workspace }}/gradlew -q printVersionName)" >> $GITHUB_ENV

      - name: Bump application version code
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: "${{ env.VERSION_NAME }} Dev (#${{ github.run_number }})"

      - name: Build with Gradle
        run: |
          ./gradlew assembleStandardDebug
          mv app/build/outputs/apk/standard/debug/*.apk ${{ env.APK_NAME }}

      - name: Upload Standard Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Iconify Fork v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }})"
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Upload Release
        run: |
          gh release upload --clobber nightly ${{ env.APK_NAME }}
          gh release edit nightly --title "Nightly v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}